<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1 — Практика</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .quiz-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: left;
            color: #333333;
        }
        .progress-bar {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .input-block {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .answer-input {
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 6px;
            width: 180px;
            outline: none;
        }
        .answer-input:focus {
            border-color: #3498db;
        }
        .btn-check, .btn-next {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-check {
            background-color: #3498db;
            color: white;
        }
        .btn-check:hover {
            background-color: #2980b9;
        }
        .btn-next {
            background-color: #2ecc71;
            color: white;
            display: none;
        }
        .btn-next:hover {
            background-color: #27ae60;
        }
        .result-msg {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📝 Задание 1: Практический тренажёр</h1>
    </header>

    <main class="quiz-container">
        <div class="progress-bar" id="progress">Задание 1 из 100</div>
        
        <div class="question-text" id="question">Загрузка задачи...</div>

        <div class="input-block">
            <input type="text" id="user-answer" class="answer-input" placeholder="Введите ответ">
            <button class="btn-check" id="check-button" onclick="verifyAnswer()">Проверить</button>
            <button class="btn-next" id="next-button" onclick="loadNextQuestion()">Следующее →</button>
        </div>
        <div class="result-msg" id="result-text"></div>
    </main>

    <script>
        const tasks = [
            {
                text: "Сырок стоит 16 рублей. Какое наибольшее число сырков можно купить на 100 рублей?",
                answer: "6"
            },
            {
                text: "Для ремонта квартиры требуется 63 рулона обоев. Какое наименьшее количество пачек обойного клея нужно купить, если одна пачка клея рассчитана на 6 рулонов?",
                answer: "11"
            },
            {
                text: "Билет на поезд стоит 830 рублей. Ученикам предоставляется скидка 50%. Сколько рублей стоит проезд группы из 4 учеников и 2 взрослых?",
                answer: "3320"
            },
            {
                text: "В пачке 500 листов бумаги формата А4. За неделю в офисе расходуется 1200 листов. Какое наименьшее количество пачек бумаги нужно купить на 4 недели?",
                answer: "10"
            },
            {
                text: "Теплоход рассчитан на 750 пассажиров и 25 членов команды. Каждая спасательная шлюпка может вместить 70 человек. Какое наименьшее число шлюпок должно быть на теплоходе?",
                answer: "12"
            }
        ];

        let currentIndex = 0;
        function showQuestion() {
            if (currentIndex < tasks.length) {
                document.getElementById("progress").innerText = `Задание ${currentIndex + 1} из ${tasks.length}`;
                document.getElementById("question").innerText = tasks[currentIndex].text;
                document.getElementById("user-answer").value = "";
                document.getElementById("user-answer").disabled = false;
                document.getElementById("result-text").innerText = "";
                document.getElementById("check-button").style.display = "block";
                document.getElementById("next-button").style.display = "none";
            } else {
                document.getElementById("progress").innerText = "Поздравляем!";
                document.getElementById("question").innerHTML = "🎉 Вы успешно прошли все доступные задания из подборки!";
                document.getElementById("input-block").style.display = "none";
                document.getElementById("result-text").innerText = "";
            }
        }

        function verifyAnswer() {
            let userAns = document.getElementById("user-answer").value.trim();
            let correctAns = tasks[currentIndex].answer;
            let resultBlock = document.getElementById("result-text");

            if (userAns === "") {
                resultBlock.innerText = "⚠️ Введите ответ!";
                resultBlock.style.color = "#f39c12";
                return;
            }

            if (userAns === correctAns) {
                resultBlock.innerText = "🎉 Правильно! Ответ верный.";
                resultBlock.style.color = "#2ecc71";
                document.getElementById("user-answer").disabled = true;
                document.getElementById("check-button").style.display = "none";
                document.getElementById("next-button").style.display = "block";
            } else {
                resultBlock.innerText = "❌ Неверно. Попробуйте ещё раз.";
                resultBlock.style.color = "#e74c3c";
            }
        }

        function loadNextQuestion() {
            currentIndex++;
            showQuestion();
        }

        showQuestion();
    </script>

</body>
</html>
